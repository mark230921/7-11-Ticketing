<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Reports Portal</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>
<nav class="navbar">
  <ul class="nav-links">
    <li class="nav-item">
<a href="page.html" style="background-image: url('news.png'); background-size: contain; width: 30px; height: 30px; background-position: center; background-repeat: no-repeat;"></a>
    </li>
    <li class="nav-item">
<a href="home.html" style="background-image: url('report.png'); background-size: contain; width: 30px; height: 30px; background-position: center; background-repeat: no-repeat;"></a>
    </li>
    <li class="nav-item">
<a href="inbox.html" style="background-image: url('inbox.png'); background-size: contain; width: 30px; height: 30px; background-position: center; background-repeat: no-repeat;"></a>
    </li>
    <li class="nav-item">
<a href="admin.html" style="background-image: url('admin.png'); background-size: contain; width: 30px; height: 30px; background-position: center; background-repeat: no-repeat;"></a>
    </li>
    <li class="nav-item">
      <a href="#" class="nav-logout-btn" style="background-image: url('logout.png'); background-size: contain; width: 30px; height: 30px; background-position: center; background-repeat: no-repeat;"></a>
    </li>
  </ul>
</nav>
  <div class="container">
    <div class="header">
      <div class="header-title-group">
        <h1>Admin Reports Portal</h1>
        <button id="openModalBtn" class="btn-open">Add News and Updates</button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-card">
        <h3>Total Submitted Reports</h3>
        <div class="number" id="totalReportsCount">0</div>
      </div>
      <div class="stat-card">
        <h3>Unique Reporters</h3>
        <div class="number" id="uniqueUsersCount">0</div>
      </div>
    </div>

    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by User ID, Username, Machine, or Issue...">
    </div>

    <div id="statusBanner" class="status-banner"></div>

    <div class="reports-table-container">
      <table id="reportsTable">
        <thead>
          <tr>
            <th>User / ID</th>
            <th>Machine</th>
            <th>Issue Description</th>
            <th>Attachment</th>
            <th>Timestamp</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportsTableBody">
          <tr>
            <td colspan="6" class="empty-state">Loading submitted reports...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Admin Announcement Modal -->
  <div class="modal-overlay" id="adminModal" aria-hidden="true">
    <div class="modal-container">
      <button class="modal-close-btn" id="closeModalBtn" aria-label="Close modal">&times;</button>

      <div class="bento-card" id="adminPostCard">
        <h2>Post Admin Update / News</h2>
        <form id="updateForm">
          <div class="form-group">
            <label for="updateTitle">Announcement Title</label>
            <input type="text" id="updateTitle" required placeholder="News and Updates">
          </div>

          <div class="form-group">
            <label for="updateContent">Content / Description</label>
            <textarea id="updateContent" required placeholder="Write details of update or news..."></textarea>
          </div>

          <!-- Image Upload Field -->
          <div class="form-group">
            <label for="updateImage">Attach Image (Optional)</label>
            <input type="file" id="updateImage" accept="image/*">
          </div>

          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
            <button type="submit" id="postBtn" class="btn-submit">Publish Announcement</button>
          </div>
          <div id="statusMsg" class="status-msg"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- Message User Modal -->
  <div class="modal-overlay" id="msgModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Send Message to User</h2>
        <button class="close-btn" id="closeMsgBtn">&times;</button>
      </div>
      <form id="msgForm">
        <div class="form-group">
          <label>Recipient User ID:</label>
          <input type="text" id="recipientDisplay" disabled>
        </div>
        <div class="form-group">
          <label for="msgText">Message Content:</label>
          <textarea id="msgText" required placeholder="Write message or update to user..."></textarea>
        </div>
        <button type="submit" id="sendBtn" class="btn-send">Send Message</button>
      </form>
    </div>
  </div>

  <script src="Script.js"></script>
</body>
</html>
